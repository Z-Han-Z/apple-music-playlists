name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and verify console scripts
        run: |
          python -m pip install .
          am-playlist --help
          python -c "from importlib.metadata import version; assert version('apple-music-playlists') == '1.2.0'"
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
